      <stop offset="0%" stop-color="#261d4a"/>
      <stop offset="60%" stop-color="#141028"/>
      <stop offset="100%" stop-color="#090712"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd970"/>
      <stop offset="50%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#9d7b22"/>
