    <polygon points="0,-105 92,-52 0,0" fill="#8b5cf6" fill-opacity="0.18" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="0,-105 -92,-52 0,0" fill="#e5c158" fill-opacity="0.12" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="-92,-52 -92,52 0,0" fill="#8b5cf6" fill-opacity="0.12" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="92,-52 92,52 0,0" fill="#e5c158" fill-opacity="0.16" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="-92,52 0,105 0,0" fill="#e5c158" fill-opacity="0.12" stroke="url(#gold)" stroke-width="2"/>
    <polygon points="92,52 0,105 0,0" fill="#8b5cf6" fill-opacity="0.2" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="16" text-anchor="middle" fill="#ffd970" font-family="Cinzel, Georgia, serif" font-weight="800" font-size="48">20</text>
