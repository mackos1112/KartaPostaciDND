  <text x="600" y="562" text-anchor="middle" fill="#9a90b8" font-family="Inter, Segoe UI, sans-serif" font-size="17">SRD 5.1 (CC-BY-4.0) • dnd5e.wikidot.com • aidedd.org/monster-dnd5 • PL / EN</text>
