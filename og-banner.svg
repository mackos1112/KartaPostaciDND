  <text x="600" y="405" text-anchor="middle" fill="#e2dcf5" font-family="Inter, Segoe UI, sans-serif" font-weight="600" font-size="26">Kreator Postaci (1–20) • Karta Postaci • Księga Zaklęć • Bestiariusz</text>

