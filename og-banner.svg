  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.7"/>
  <rect x="38" y="38" width="1124" height="554" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 6"/>

  <!-- D20 Emblem -->
  <g transform="translate(600, 175)">
